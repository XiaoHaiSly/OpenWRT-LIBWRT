#CI项目
name: ImmortalWRT-QCA

#CI计划
on:
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [IPQ60XX, IPQ807X]
        SOURCE: [XiaoHaiSly/LibWrt]
        BRANCH: [25.12-nss]
        include:
          #只有一个平台编译用户态插件（同架构通用），其余平台只出内核模块
          - CONFIG: IPQ60XX
            FEED_USER: true
          - CONFIG: IPQ807X
            FEED_USER: false

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: LibWrt
      #默认WIFI名称
      WRT_SSID: LibWrt
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #是否编译用户态插件到软件源
      WRT_FEED_USER: ${{matrix.FEED_USER}}

  #汇总所有平台的软件源，校验内核一致后统一发布
  publish:
    name: Publish Feed
    needs: config
    if: ${{ needs.config.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Download Feed
        uses: actions/download-artifact@v8
        with:
          pattern: feed-*
          path: public
          merge-multiple: true

      - name: Download Vermagic
        uses: actions/download-artifact@v8
        with:
          pattern: vermagic-*
          path: vermagic
          merge-multiple: true

      - name: Verify Kernel Match
        run: |
          #固件和软件源的内核 vermagic 一致性验证
          FAIL=0
          for F in vermagic/*.txt; do
            CFG=$(basename "$F" .txt)
            SUB=${CFG,,}
            FW=$(cat "$F")
            FD=$(cat "public/kmods/$SUB/vermagic" 2>/dev/null || echo missing)
            if [ "$FW" = "$FD" ]; then
              echo "OK   $CFG: $FW"
            else
              echo "FAIL $CFG: firmware=$FW feed=$FD"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || { echo "内核不一致，本次不发布软件源（旧软件源保持不变）"; exit 1; }

      - name: Check File Size
        run: |
          #Cloudflare Pages 单文件上限 25MiB，超出的文件跳过
          find public -type f -size +25M -print -delete | sed 's/^/too large, skipped on Pages: /' || true
          echo "files: $(find public -type f | wc -l) (Pages limit 20000)"

      - name: Index Page
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><title>Feed</title><h1>Feed</h1><ul>'
            find public -name '*.adb' | sort | while read -r F; do
              echo "<li><a href="/${F#public/}">${F#public/}</a></li>"
            done
            echo '</ul>'
          } > public/index.html

      - name: Get Pages Project
        run: |
          echo "CF_PROJECT=$(bash Scripts/Feed.sh project)" >> "$GITHUB_ENV"

      - name: Deploy To Cloudflare Pages
        if: ${{ env.CF_PROJECT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{secrets.CLOUDFLARE_ACCOUNT_ID}}
          apiToken: ${{secrets.CLOUDFLARE_API_TOKEN}}
          command: pages deploy public --project-name=${{env.CF_PROJECT}} --branch=main
